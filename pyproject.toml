[project]
name = "backstory"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "Django==5.2.18",
  "argon2-cffi==25.1.0",
  "gunicorn==26.2.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-django==4.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
