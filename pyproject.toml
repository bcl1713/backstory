[project]
name = "backstory"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "Django==5.2.18",
  "argon2-cffi==25.1.0",
  "django-axes==8.3.1",
  "gunicorn==26.2.0",
  "linkify-it-py==2.2.0",
  "markdown-it-py==4.2.0",
  "mdit-py-plugins==0.6.1",
  "nh3==0.3.7",
  "pyyaml==6.0.3",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-django==4.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
